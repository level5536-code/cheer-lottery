<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>チアリ感謝祭</title><style>body{background:#102b23;color:#fff2d1;font:16px system-ui;max-width:600px;margin:auto;padding:16px}textarea,button,select{box-sizing:border-box;width:100%;font:inherit;padding:12px;margin:8px 0;border-radius:10px}button{background:#e9c778;font-weight:bold}pre{white-space:pre-wrap}h1,h2{text-align:center}canvas{width:100%;max-width:400px;display:block;margin:auto}</style><h1>🎄 チアリ感謝祭</h1><p>2026.12.22</p><section id="setup"><p>名前,レベル,過去継続回数（0〜7）を1行ずつ入力</p><textarea id="input" rows="8"></textarea><select id="mode"><option>練習</option><option>本番</option></select><button id="demo">仮メンバー</button><button id="preview">設定確認</button><pre id="check"></pre><button id="start">確定して開始</button></section><section id="game" hidden><h2 id="prize"></h2><canvas id="wheel" width="500" height="500"></canvas><h2 id="winner"></h2><button id="draw">抽選する</button><pre id="history"></pre><button id="copy">結果コピー</button><button id="reset">新規抽選会</button></section><script>
const $=x=>document.getElementById(x),key='cheer-v1',base=[1,2,3,5,7,10,15,25],bonus=[0,1,2,4,5,7,8,10];let s=null,busy=false;
function config(){let seen=new Set(),p=$('input').value.trim().split(/\n/).map(line=>{let a=line.split(',').map(x=>x.trim()),[name,l,c]=a;let lv=+l,k=+c;if(a.length!==3||!name||!l||!c||seen.has(name)||!Number.isInteger(lv)||lv<10||lv>55||!Number.isInteger(k)||k<0||k>7)throw Error('入力不備または名前重複');seen.add(name);return{name,r:base[Math.min(7,Math.floor((lv-10)/5))],c:bonus[k]}});if(p.length<3||!p.some(x=>x.c))throw Error('参加者3人以上・継続者1人以上が必要');let prizes=['エモモ券・今月の応援賞','エモモ券・継続応援賞'],n=Math.ceil(p.length/2)-2;if(n===1)prizes.push('有償10000＋無償20000コイン');if(n>1){let a=Math.max(1,Math.round(n/3)),b=n-a;for(let [k,v,t] of [[a,10000,'有償'],[b,20000,'無償']])for(let i=0;i<k;i++)prizes.push(t+(Math.floor(v/k)+(i<v%k?1:0))+'コイン')}return{p,prizes,results:[],mode:$('mode').value}}
function pool(){let i=s.results.length,p=s.p.filter(x=>!s.results.some(y=>y.name===x.name));if(i===0&&p.filter(x=>x.c).length===1)p=p.filter(x=>!x.c);return p.map(x=>({...x,w:i===0?x.r:i===1?x.c:x.r+x.c})).filter(x=>x.w)}
function paint(p,rot=0){let c=$('wheel').getContext('2d'),sum=p.reduce((a,x)=>a+x.w,0),a=rot-Math.PI/2;c.clearRect(0,0,500,500);p.forEach((x,i)=>{let b=a+2*Math.PI*x.w/sum;c.beginPath();c.moveTo(250,250);c.arc(250,250,230,a,b);c.closePath();c.fillStyle=['#a43d43','#28664f','#ae803a','#37596a'][i%4];c.fill();c.save();c.translate(250,250);c.rotate((a+b)/2);c.fillStyle='white';c.font='16px sans-serif';c.textAlign='right';c.fillText(x.name.slice(0,12),210,0);c.restore();a=b});c.fillStyle='#fff2d1';c.beginPath();c.moveTo(235,0);c.lineTo(265,0);c.lineTo(250,40);c.fill()}
function render(){let i=s.results.length;$('setup').hidden=true;$('game').hidden=false;$('prize').textContent=s.mode+' '+i+'/'+s.prizes.length+' '+(s.prizes[i]||'終了');$('winner').textContent=s.results.at(-1)?.name||'';$('history').textContent=s.results.map(x=>x.prize+'：'+x.name).join('\n');$('draw').disabled=i>=s.prizes.length;paint(pool())}
function save(){localStorage.setItem(key,JSON.stringify(s))}
$('demo').onclick=()=>{$('input').value='さくら,10,7\nゆき,20,3\nそら,30,0\nりん,15,5\nくま,35,2\nもち,10,0\nねこ,25,4\nひな,15,0\nあお,20,2\nるな,10,3';$('mode').selectedIndex=0};
$('preview').onclick=()=>{try{let x=config();$('check').textContent=x.p.map(y=>y.name+' '+y.r+'＋'+y.c+'口').join('\n')+'\n'+x.prizes.join('\n')}catch(e){alert(e.message)}};
$('start').onclick=()=>{try{let x=config();if(confirm('設定を確定しますか？')){s=x;save();render()}}catch(e){alert(e.message)}};
$('draw').onclick=()=>{if(busy||s.results.length>=s.prizes.length)return;let p=pool(),n=p.reduce((a,x)=>a+x.w,0);if(!n)return alert('対象なし');let a=new Uint32Array(1),limit=4294967296-4294967296%n;do{crypto.getRandomValues(a)}while(a[0]>=limit);let v=a[0]%n,offset=0,w;for(let x of p){if(v<x.w){w=x;break}v-=x.w;offset+=x.w}let end=12*Math.PI-2*Math.PI*(offset+w.w/2)/n;s.results.push({name:w.name,prize:s.prizes[s.results.length],time:new Date().toISOString()});try{save()}catch(e){s.results.pop();return alert('保存失敗')}busy=true;$('draw').disabled=true;$('winner').textContent='抽選中…';let t=performance.now();function tick(now){let f=Math.min(1,(now-t)/3500);paint(p,end*(1-(1-f)**3));if(f<1)requestAnimationFrame(tick);else{busy=false;render();paint(p,end)}}requestAnimationFrame(tick)};
$('copy').onclick=()=>navigator.clipboard.writeText($('history').textContent).catch(()=>alert('長押しでコピーしてください'));
$('reset').onclick=()=>{if(busy)return;if(s.mode==='本番'&&s.results.length<s.prizes.length)return alert('本番途中はリセットできません');if(confirm('記録を消去しますか？')){localStorage.removeItem(key);location.reload()}};
try{s=JSON.parse(localStorage.getItem(key));if(s)render()}catch(e){alert('保存データ読み込み失敗')}
</script></html>
