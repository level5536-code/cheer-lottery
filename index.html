<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>チアリ感謝祭</title><style>body{background:#102b23;color:#fff2d1;font:16px system-ui;max-width:600px;margin:auto;padding:16px}textarea,button,select{box-sizing:border-box;width:100%;font:inherit;padding:12px;margin:8px 0;border-radius:10px}button{background:#e9c778;font-weight:bold}pre{white-space:pre-wrap}h1,h2{text-align:center}canvas{width:100%;max-width:400px;display:block;margin:auto}body{box-sizing:border-box;min-height:100vh;background:radial-gradient(ellipse at 50% 40%,#285a45 0%,#102b23 45%,#080e19 100%);position:relative;padding:18px;color:#fff4d7}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,#fff9 1px,transparent 2px) 0 0/47px 71px,radial-gradient(circle,#ffd77a99 1px,transparent 2px) 20px 30px/83px 97px;z-index:-1}h1{font-size:clamp(24px,7vw,38px);margin:20px 0 4px;text-shadow:0 2px 12px #d9a94b}h1+p{text-align:center;letter-spacing:.25em;font-size:12px;color:#e9c778}section{background:#071a20aa;border:1px solid #cfa85c88;border-radius:22px;padding:16px;box-shadow:0 12px 35px #0006}button{border:1px solid #ffe9a2;background:linear-gradient(120deg,#af7424,#ffebad 48%,#c99136);color:#341a08;box-shadow:0 4px 0 #80531c,0 0 15px #f5c86a44;min-height:48px}button:disabled{opacity:.5}textarea,select{background:#fff8e8;color:#172c25}#prize{font-size:20px;color:#ffe1a0;min-height:55px}#winner{min-height:1.5em;font-size:25px}#stage{position:relative;margin:8px auto 20px;max-width:420px;padding:12px;border-radius:50%;background:conic-gradient(#a36a20,#fff2b0,#b27a26,#fff2b0,#a36a20);box-shadow:0 0 25px #ffd36b88,0 0 80px #f9b64b33}#stage:after{content:"";position:absolute;inset:3px;border:3px dotted #fff6c6;border-radius:50%;pointer-events:none}#stage.spinning:after{animation:blink .3s infinite alternate}canvas{border-radius:50%;background:#171e22}#history{border-top:1px solid #b99755;padding-top:14px;font-size:14px}#reveal{position:fixed;inset:0;z-index:10;background:radial-gradient(circle,#a5672e,#351223 45%,#080d19 85%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:hidden}#reveal[hidden]{display:none}#reveal h2{font-size:clamp(24px,8vw,46px);z-index:1;text-shadow:0 0 18px #ffdc73;overflow-wrap:anywhere;max-width:100%}#reveal p,#reveal button,#reveal strong{z-index:1}#reveal strong{letter-spacing:.2em;color:#ffdf83}#reveal button{max-width:360px}#reveal .gift{font-size:78px;animation:pop .7s both}#reveal.coin{background:radial-gradient(circle,#557c83,#112c39 55%,#080d19)}#reveal.paid{background:radial-gradient(circle,#9a671b,#38250f 55%,#080d19)}.confetti{position:absolute;top:-20px;width:8px;height:15px;animation:fall 4s linear infinite;pointer-events:none}@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(900deg)}}@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}@keyframes blink{to{opacity:.25}}@media(prefers-reduced-motion:reduce){.confetti,#stage:after,#reveal .gift{animation:none}} #game{padding:12px}#stage{width:min(78vw,40vh,390px);box-sizing:border-box;margin:8px auto}#sound{width:auto;min-height:32px;padding:5px 10px;font-size:12px;display:block;margin:8px auto}#prize{min-height:0;margin:8px 0;font-size:17px}#winner{margin:8px 0;font-size:24px}#history{white-space:normal}#history div{background:#ffffff0c;border:1px solid #cfa85c55;border-radius:10px;padding:10px;margin:6px 0}#history strong{display:block;color:#ffe2a0;font-size:18px}#history small{color:#e0d7c4} </style><h1>🎄 チアリ感謝祭</h1><p>2026.12.22</p><section id="setup"><p>名前,レベル,過去継続回数（0〜7）を1行ずつ入力</p><textarea id="input" rows="8"></textarea><select id="mode"><option>練習</option><option>本番</option></select><button id="demo">仮メンバー</button><button id="preview">設定確認</button><pre id="check"></pre><button id="start">確定して開始</button></section><section id="game" hidden><h2 id="prize"></h2><div id="stage"><canvas id="wheel" width="500" height="500"></canvas></div><button id="sound">🔊 サウンド ON / OFF</button><h2 id="winner"></h2><button id="draw">抽選する</button><pre id="history"></pre><button id="copy">結果コピー</button><button id="reset">新規抽選会</button></section><div id="reveal" hidden role="dialog" aria-modal="true"><strong id="tier"></strong><div class="gift">🎁</div><p id="award"></p><h2 id="champion"></h2><p>おめでとうございます！</p><button id="next">次へ</button></div><script>
const $=x=>document.getElementById(x),key='cheer-v1',base=[1,2,3,5,7,10,15,25],bonus=[0,1,2,4,5,7,8,10];let s=null,busy=false,muted=false,audio=null; function tone(freq,d=.12,delay=0){if(muted||!audio)return;try{let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+delay;o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.045,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d)}catch{}} $('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇 サウンド OFF':'🔊 サウンド ON'};function celebrate(r){let el=$('reveal'),top=r.prize.startsWith('エモモ'),paid=r.prize.startsWith('有償');el.className=top?'':paid?'paid':'coin';$('tier').textContent=top?'★ SPECIAL GRAND PRIZE ★':paid?'★ GOLD PRIZE ★':'★ HAPPY PRIZE ★';$('award').textContent=r.prize;$('champion').textContent=r.name+' さん';el.querySelectorAll('.confetti').forEach(x=>x.remove());for(let i=0;i<(top?65:30);i++){let d=document.createElement('i');d.className='confetti';d.style.left=(i*37%100)+'%';d.style.background=['#ffe18a','#fff','#dc5a6f','#61d5b8'][i%4];d.style.animationDelay=-(i%19)/5+'s';d.style.setProperty('--drift',(i%2?90:-90)+'px');el.append(d)}el.hidden=false;[523,659,784,1047].forEach((f,i)=>tone(f,.35,i*.15));$('next').focus()} $('next').onclick=()=>{$('reveal').hidden=true;render()};
function config(){let seen=new Set(),p=$('input').value.trim().split(/\n/).map(line=>{let a=line.split(',').map(x=>x.trim()),[name,l,c]=a;let lv=+l,k=+c;if(a.length!==3||!name||!l||!c||seen.has(name)||!Number.isInteger(lv)||lv<10||lv>55||!Number.isInteger(k)||k<0||k>7)throw Error('入力不備または名前重複');seen.add(name);return{name,r:base[lv>=50?7:Math.min(6,Math.floor((lv-10)/5))],c:bonus[k]}});if(p.length<3||!p.some(x=>x.c))throw Error('参加者3人以上・継続者1人以上が必要');let prizes=['エモモ券・今月の応援賞','エモモ券・継続応援賞'],n=Math.ceil(p.length/2)-2;if(n===1)prizes.push('有償10000＋無償20000コイン');if(n>1){let a=Math.max(1,Math.round(n/3)),b=n-a;for(let [k,v,t] of [[a,10000,'有償'],[b,20000,'無償']])for(let i=0;i<k;i++)prizes.push(t+(Math.floor(v/k)+(i<v%k?1:0))+'コイン')}return{p,prizes,results:[],mode:$('mode').value}}
function pool(){let i=s.results.length,p=s.p.filter(x=>!s.results.some(y=>y.name===x.name));if(i===0&&p.filter(x=>x.c).length===1)p=p.filter(x=>!x.c);return p.map(x=>({...x,w:i===0?x.r:i===1?x.c:x.r+x.c})).filter(x=>x.w)}
function paint(p,rot=0){let c=$('wheel').getContext('2d'),sum=p.reduce((a,x)=>a+x.w,0),a=rot-Math.PI/2;c.clearRect(0,0,500,500);p.forEach((x,i)=>{let b=a+2*Math.PI*x.w/sum;c.beginPath();c.moveTo(250,250);c.arc(250,250,230,a,b);c.closePath();const colors=['#a52d49','#17664f','#285b91','#70418c','#a67824'];c.fillStyle=colors[i===p.length-1&&i>0&&i%colors.length===0?2:i%colors.length];c.fill();c.strokeStyle='#ead19a';c.lineWidth=2;c.stroke();c.save();c.translate(250,250);let mid=(a+b)/2;c.translate(155*Math.cos(mid),155*Math.sin(mid));c.fillStyle='white';c.font='bold 18px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(Array.from(x.name).slice(0,12).join(''),0,0,Math.max(36,Math.min(135,280*Math.sin(Math.min(Math.PI/2,(b-a)/2)))));c.restore();a=b});c.fillStyle='#fff2d1';c.beginPath();c.moveTo(235,0);c.lineTo(265,0);c.lineTo(250,40);c.fill()}
function render(){let i=s.results.length;$('setup').hidden=true;$('game').hidden=false;$('prize').textContent=s.mode+' '+i+'/'+s.prizes.length+' '+(s.prizes[i]||'終了');$('winner').textContent=s.results.at(-1)?.name||'';$('history').replaceChildren(...s.results.map(x=>{let d=document.createElement('div'),a=document.createElement('small'),b=document.createElement('strong');a.textContent=x.prize;b.textContent='🏆 '+x.name;d.append(a,b);return d}));$('draw').textContent=i>=s.prizes.length?'全抽選終了！': '抽選スタート';$('draw').disabled=i>=s.prizes.length;if(i>=s.prizes.length){$('stage').hidden=true;$('winner').textContent='🎊 全'+i+'名 当選発表 🎊'}else{$('stage').hidden=false;paint(pool())}}
function save(){localStorage.setItem(key,JSON.stringify(s))}
$('demo').onclick=()=>{$('input').value='さくら,10,7\nゆき,20,3\nそら,30,0\nりん,15,5\nくま,35,2\nもち,10,0\nねこ,25,4\nひな,15,0\nあお,20,2\nるな,10,3';$('mode').selectedIndex=0};
$('preview').onclick=()=>{try{let x=config();$('check').textContent=x.p.map(y=>y.name+' '+y.r+'＋'+y.c+'口').join('\n')+'\n'+x.prizes.join('\n')}catch(e){alert(e.message)}};
$('start').onclick=()=>{try{let x=config();if(confirm('設定を確定しますか？')){s=x;save();render()}}catch(e){alert(e.message)}};
$('draw').onclick=()=>{if(busy||s.results.length>=s.prizes.length)return;let p=pool(),n=p.reduce((a,x)=>a+x.w,0);if(!n)return alert('対象なし');let a=new Uint32Array(1),limit=4294967296-4294967296%n;do{crypto.getRandomValues(a)}while(a[0]>=limit);let v=a[0]%n,offset=0,w;for(let x of p){if(v<x.w){w=x;break}v-=x.w;offset+=x.w}let end=12*Math.PI-2*Math.PI*(offset+w.w/2)/n;s.results.push({name:w.name,prize:s.prizes[s.results.length],time:new Date().toISOString()});try{save()}catch(e){s.results.pop();return alert('保存失敗')}busy=true;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{})}catch{}$('draw').disabled=true;$('stage').classList.add('spinning');$('winner').textContent='3';let t=performance.now(),last=-1;function tick(now){let elapsed=now-t;if(elapsed<3000){let k=Math.floor(elapsed/1000);$('winner').textContent=String(3-k);if(k!==last){tone(440);last=k}requestAnimationFrame(tick);return}let f=Math.min(1,(elapsed-3000)/8500),rot=end*(1-(1-f)**3);$('winner').textContent='抽選中…';paint(p,rot);let k=Math.floor(rot*3)+10;if(k!==last){tone(660,.055);last=k}if(f<1)requestAnimationFrame(tick);else{$('stage').classList.remove('spinning');busy=false;paint(p,end);$('winner').textContent=w.name+' さん';celebrate(s.results.at(-1))}}requestAnimationFrame(tick)};
$('copy').onclick=()=>navigator.clipboard.writeText(s.results.map(x=>x.prize+'：'+x.name).join('\n')).catch(()=>alert('長押しでコピーしてください'));
$('reset').onclick=()=>{if(busy)return;if(s.mode==='本番'&&s.results.length<s.prizes.length)return alert('本番途中はリセットできません');if(confirm('記録を消去しますか？')){localStorage.removeItem(key);location.reload()}};
try{s=JSON.parse(localStorage.getItem(key));if(s)render()}catch(e){alert('保存データ読み込み失敗')}
</script></html>
